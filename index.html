<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PokéGame</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      color: #e0e0e0;
      overflow-x: hidden;
    }

    #canvas-container {
      position: relative;
      border: 3px solid #444;
      border-radius: 6px;
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* Fullscreen: black background, canvas centered */
    #canvas-container:fullscreen {
      width: 100vw;
      height: 100vh;
      border: none;
      border-radius: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #controls {
      margin-top: 12px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    button {
      background: #2d2d4e;
      color: #e0e0e0;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 6px 16px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.15s;
    }
    button:hover { background: #3d3d6e; }

    #loading {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      z-index: 10;
    }

    #loading.hidden { display: none; }

    #status {
      margin-bottom: 12px;
      font-size: 16px;
    }

    progress {
      width: 240px;
      height: 12px;
      appearance: none;
      -webkit-appearance: none;
    }
    progress::-webkit-progress-bar { background: #333; border-radius: 6px; }
    progress::-webkit-progress-value { background: #5b7fff; border-radius: 6px; }
    progress::-moz-progress-bar { background: #5b7fff; border-radius: 6px; }

    /* ── Mobile touch controls ── */
    #touch-controls {
      display: none;
      width: 100%;
      max-width: 100vw;
      padding: 10px 12px 16px;
      justify-content: space-between;
      align-items: center;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    /* D-Pad */
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 52px);
      grid-template-rows: repeat(3, 52px);
      gap: 4px;
    }
    .dpad-btn {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      background: #2d2d4e;
      border: 2px solid #555;
      color: #ccc;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .dpad-btn:active, .dpad-btn.pressed { background: #5b7fff; border-color: #7b9fff; }
    .dpad-blank { visibility: hidden; }

    /* Action buttons */
    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }
    .action-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .action-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #2d2d4e;
      border: 2px solid #555;
      color: #e0e0e0;
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .action-btn:active, .action-btn.pressed { background: #5b7fff; border-color: #7b9fff; }
    .action-btn.btn-a { background: #2e5e2e; border-color: #4a8; }
    .action-btn.btn-a:active, .action-btn.btn-a.pressed { background: #4a8; }
    .action-btn.btn-b { background: #6e2e2e; border-color: #a44; }
    .action-btn.btn-b:active, .action-btn.btn-b.pressed { background: #a44; }

    .small-buttons {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
    .small-btn {
      height: 32px;
      padding: 0 14px;
      border-radius: 16px;
      background: #333;
      border: 1px solid #555;
      color: #bbb;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .small-btn:active, .small-btn.pressed { background: #5b7fff; }

    /* ── Responsive: phone layout ── */
    @media (max-width: 768px) {
      body {
        justify-content: center;
      }
      #canvas-container {
        border-width: 2px;
        border-radius: 4px;
      }
      #controls {
        display: none;
      }
      #touch-controls {
        display: flex;
      }
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <div id="loading">
      <div id="status">Loading...</div>
      <progress id="progress" value="0" max="100"></progress>
    </div>
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  </div>

  <div id="controls">
    <button id="fullscreen-btn">Fullscreen</button>
  </div>

  <!-- Mobile touch controls -->
  <div id="touch-controls">
    <div class="dpad">
      <div class="dpad-blank"></div>
      <button class="dpad-btn" data-key="ArrowUp" data-code="ArrowUp">▲</button>
      <div class="dpad-blank"></div>
      <button class="dpad-btn" data-key="ArrowLeft" data-code="ArrowLeft">◀</button>
      <div class="dpad-blank"></div>
      <button class="dpad-btn" data-key="ArrowRight" data-code="ArrowRight">▶</button>
      <div class="dpad-blank"></div>
      <button class="dpad-btn" data-key="ArrowDown" data-code="ArrowDown">▼</button>
      <div class="dpad-blank"></div>
    </div>
    <div class="action-buttons">
      <div class="action-row">
        <button class="action-btn btn-b" data-key="x" data-code="KeyX">B</button>
        <button class="action-btn btn-a" data-key="z" data-code="KeyZ">A</button>
      </div>
      <div class="small-buttons">
        <button class="small-btn" data-key="Shift" data-code="ShiftLeft">Run</button>
        <button class="small-btn" data-key="c" data-code="KeyC">Menu</button>
      </div>
    </div>
  </div>

  <script>
    var statusElement = document.getElementById('status');
    var progressElement = document.getElementById('progress');
    var loadingElement = document.getElementById('loading');
    var canvasElement = document.getElementById('canvas');
    var containerElement = document.getElementById('canvas-container');

    canvasElement.addEventListener('webglcontextlost', function(e) {
      alert('WebGL context lost. You will need to reload the page.');
      e.preventDefault();
    }, false);

    document.getElementById('fullscreen-btn').addEventListener('click', function() {
      if (containerElement.requestFullscreen) containerElement.requestFullscreen();
      else if (containerElement.webkitRequestFullscreen) containerElement.webkitRequestFullscreen();
    });

    var setStatus = function(text) {
      if (!setStatus.last) setStatus.last = { time: Date.now(), text: '' };
      if (text === setStatus.last.text) return;
      var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
      var now = Date.now();
      if (m && now - setStatus.last.time < 30) return;
      setStatus.last.time = now;
      setStatus.last.text = text;
      if (m) {
        statusElement.textContent = m[1];
        progressElement.value = parseInt(m[2]) * 100;
        progressElement.max = parseInt(m[4]) * 100;
      } else {
        if (!text) {
          loadingElement.classList.add('hidden');
        }
        statusElement.textContent = text;
      }
    };

    var Module = {
      print: function() {
        var args = Array.prototype.slice.call(arguments);
        console.log.apply(console, args);
      },
      printErr: function() {
        var args = Array.prototype.slice.call(arguments);
        console.warn.apply(console, args);
      },
      canvas: canvasElement,
      setStatus: setStatus,
      totalDependencies: 0,
      monitorRunDependencies: function(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        setStatus(left
          ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')'
          : 'All downloads complete.');
      }
    };

    setStatus('Downloading...');
    window.onerror = function(event) {
      setStatus('Exception thrown, see JavaScript console');
      setStatus = function(text) {
        if (text) console.error('[post-exception status] ' + text);
      };
    };

    /* ── Touch controls → keyboard events ── */
    (function() {
      var touchBtns = document.querySelectorAll('#touch-controls [data-key]');
      var activeMap = {};  // pointerId → element

      function sendKey(type, key, code) {
        var ev = new KeyboardEvent(type, {
          key: key,
          code: code,
          keyCode: keyCodeFor(key),
          which: keyCodeFor(key),
          bubbles: true,
          cancelable: true
        });
        canvasElement.dispatchEvent(ev);
      }

      function keyCodeFor(key) {
        var map = {
          'ArrowUp': 38, 'ArrowDown': 40, 'ArrowLeft': 37, 'ArrowRight': 39,
          'z': 90, 'x': 88, 'c': 67, 'Shift': 16
        };
        return map[key] || 0;
      }

      touchBtns.forEach(function(btn) {
        btn.addEventListener('pointerdown', function(e) {
          e.preventDefault();
          btn.setPointerCapture(e.pointerId);
          btn.classList.add('pressed');
          activeMap[e.pointerId] = btn;
          sendKey('keydown', btn.dataset.key, btn.dataset.code);
        });

        btn.addEventListener('pointerup', function(e) {
          e.preventDefault();
          btn.classList.remove('pressed');
          delete activeMap[e.pointerId];
          sendKey('keyup', btn.dataset.key, btn.dataset.code);
        });

        btn.addEventListener('pointercancel', function(e) {
          btn.classList.remove('pressed');
          delete activeMap[e.pointerId];
          sendKey('keyup', btn.dataset.key, btn.dataset.code);
        });

        btn.addEventListener('pointerleave', function(e) {
          if (btn.classList.contains('pressed')) {
            btn.classList.remove('pressed');
            delete activeMap[e.pointerId];
            sendKey('keyup', btn.dataset.key, btn.dataset.code);
          }
        });

        // Prevent context menu on long-press
        btn.addEventListener('contextmenu', function(e) { e.preventDefault(); });
      });
    })();

    /* ── Responsive canvas sizing ── */
    (function() {
      // We only change the CSS display size — the buffer stays untouched.
      // image-rendering: pixelated keeps it crisp.
      var MOBILE_BREAKPOINT = 768;

      function applyScale() {
        // Read the actual canvas buffer size (set by SDL_CreateWindow)
        if (canvasElement.width < 2 || canvasElement.height < 2) return; // SDL hasn't initialized yet

        var nw = 1024;
        var nh = 768;
        // The game renders at 4x pixel scale (SRC_TILE_SIZE=16, PIXEL_SCALE=4).
        // Perfect pixel scales are multiples of 1/4: 0.25 (1x), 0.5 (2x), 0.75 (3x), 1.0 (4x).
        var PIXEL_SCALE = 4;
        var isMobile = window.innerWidth <= MOBILE_BREAKPOINT;
        var maxW;

        if (isMobile) {
          maxW = window.innerWidth - 16;
        } else {
          maxW = Math.min(nw * 2, window.innerWidth * 0.9);
        }

        // Find the largest perfect-pixel scale that fits
        // Each step = 1 source pixel = nw/PIXEL_SCALE CSS pixels
        var stepPx = nw / PIXEL_SCALE; // 256 — one source-pixel worth of display
        var steps = Math.floor(maxW / stepPx);
        if (steps < 1) steps = 1;
        var cssScale = steps / PIXEL_SCALE;
        var cssScaleTransform = cssScale;

        containerElement.style.width = Math.floor(nw * cssScale) + 'px';
        containerElement.style.height = Math.floor(nh * cssScale) + 'px';
        canvasElement.style.transformOrigin = '0 0';
        canvasElement.style.transform = 'scale(' + cssScaleTransform + ')';
        console.log(cssScale);
      }

      window.addEventListener('resize', applyScale);
      window.addEventListener('orientationchange', function() {
        setTimeout(applyScale, 100);
      });

      // Keep trying until SDL has initialized the canvas
      (function waitForSDL() {
        if (canvasElement.width >= 2 && canvasElement.height >= 2) {
          applyScale();
        } else {
          requestAnimationFrame(waitForSDL);
        }
      })();
    })();
  </script>
  <script async type="text/javascript" src="program.js"></script>
</body>
</html>
